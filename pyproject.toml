[project]
name = "sesame-rl"
version = "0.1.0"
description = "Reinforcement learning locomotion for the Sesame quadruped robot, from MuJoCo simulation to the real robot"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mujoco>=3.3",
    "gymnasium>=1.1",
    "stable-baselines3>=2.7",
    "torch>=2.5",
    "numpy>=2.0",
    "requests>=2.32",
    "imageio>=2.36",
]

[dependency-groups]
dev = ["pytest>=8"]

# torch from PyTorch's CPU-only index: neither the laptop nor the Mini-PC has an
# NVIDIA GPU, and the default Linux wheel pulls in several GB of CUDA libraries.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
