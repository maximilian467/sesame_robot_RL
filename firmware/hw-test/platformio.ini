; PlatformIO build for the hardware test. Arduino IDE users can ignore this
; file and open hw-test.ino directly.

[platformio]
src_dir = .

[env:esp32s3-supermini]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
; The SuperMini has 4 MB flash (the devkit profile assumes 8 MB).
board_upload.flash_size = 4MB
board_build.partitions = default.csv
; Serial over the native USB port (the SuperMini has no USB-UART chip).
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library@3.0.2
    adafruit/Adafruit SSD1306@2.5.13
    adafruit/Adafruit GFX Library@1.12.1
    sparkfun/SparkFun BNO080 Cortex Based IMU@1.1.12
